services:
  gateway:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    depends_on:
      - agent-control-plane
      - agent-connector-email
      - agent-executor
      - agent-runtime-manager
      - agent-scheduler
      - auth-service
      - media-service
      - analysis-service
      - search-service
      - insight-service
    ports:
      - "80:80"

  auth-service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.auth_service.app:app --host 0.0.0.0 --port 8000
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://urban_insight:urban_insight@postgres:5432/urban_insight
      UPLOAD_DIR: /data/uploads
      THUMBNAIL_DIR: /data/thumbnails
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      - postgres
    volumes:
      - uploads-data:/data/uploads
      - thumbnails-data:/data/thumbnails

  media-service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.media_service.app:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    depends_on:
      - postgres
    volumes:
      - uploads-data:/data/uploads
      - thumbnails-data:/data/thumbnails

  analysis-service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.analysis_service.app:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    depends_on:
      - postgres
    volumes:
      - uploads-data:/data/uploads
      - thumbnails-data:/data/thumbnails

  search-service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.search_service.app:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    depends_on:
      - postgres
    volumes:
      - uploads-data:/data/uploads
      - thumbnails-data:/data/thumbnails

  insight-service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.insight_service.app:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    depends_on:
      - postgres
    volumes:
      - uploads-data:/data/uploads
      - thumbnails-data:/data/thumbnails

  agent-control-plane:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.agent_control_plane.app:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    depends_on:
      - postgres

  agent-connector-email:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.agent_connector_email.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
      AGENT_CONTROL_PLANE_URL: http://agent-control-plane:8000
      AGENT_EMAIL_DELIVERY_MODE: log
      AGENT_EMAIL_OUTBOX_DIR: /data/agent-email-outbox
      AGENT_EMAIL_FROM_ADDRESS: agent@urban-insight.local
      AGENT_EMAIL_ENABLE_BACKGROUND: "1"
      AGENT_EMAIL_POLL_SECONDS: 10
    depends_on:
      - agent-control-plane
    volumes:
      - agent-email-outbox-data:/data/agent-email-outbox

  agent-executor:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: uvicorn microservices.agent_executor.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
      AUTH_SERVICE_URL: http://auth-service:8000
      MEDIA_SERVICE_URL: http://media-service:8000
      ANALYSIS_SERVICE_URL: http://analysis-service:8000
      SEARCH_SERVICE_URL: http://search-service:8000
      INSIGHT_SERVICE_URL: http://insight-service:8000
      AGENT_EXECUTOR_TIMEOUT_SECONDS: 30
    depends_on:
      - auth-service
      - media-service
      - analysis-service
      - search-service
      - insight-service

  agent-runtime-manager:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: python -m microservices.agent_runtime_manager.main
    environment:
      <<: *backend-env
      AGENT_CONTROL_PLANE_URL: http://agent-control-plane:8000
      AGENT_EXECUTOR_URL: http://agent-executor:8000
      AUTH_SERVICE_URL: http://auth-service:8000
      MEDIA_SERVICE_URL: http://media-service:8000
      ANALYSIS_SERVICE_URL: http://analysis-service:8000
      SEARCH_SERVICE_URL: http://search-service:8000
      INSIGHT_SERVICE_URL: http://insight-service:8000
      AGENT_RUNTIME_POLL_SECONDS: 3
      AGENT_RUNTIME_HEARTBEAT_SECONDS: 10
      AGENT_RUNTIME_LEASE_SECONDS: 30
    depends_on:
      - agent-control-plane
      - agent-executor
      - auth-service
      - media-service
      - analysis-service
      - search-service
      - insight-service

  agent-scheduler:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    command: python -m microservices.agent_scheduler.main
    environment:
      <<: *backend-env
      AGENT_CONTROL_PLANE_URL: http://agent-control-plane:8000
      AGENT_SCHEDULER_POLL_SECONDS: 10
      AGENT_SCHEDULER_DISPATCH_LIMIT: 20
    depends_on:
      - agent-control-plane

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urban_insight
      POSTGRES_USER: urban_insight
      POSTGRES_PASSWORD: urban_insight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  agent-email-outbox-data:
  postgres-data:
  uploads-data:
  thumbnails-data:
