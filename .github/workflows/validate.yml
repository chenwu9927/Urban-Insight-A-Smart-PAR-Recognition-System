name: Validate Repository

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Install Python validation dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate repository
        run: python scripts/validate_repo.py --install-frontend-deps

      - name: Ensure generated contracts are committed
        run: git diff --exit-code -- contracts/http
